name: Bug report
description: Report a reproducible installer or Agent problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, API keys, tokens, private keys, customer data, or complete .env files.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Windows installer
        - VPS deployment
        - Feishu integration
        - Email integration
        - Search and lead discovery
        - WhatsApp integration
        - Agent runtime
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: input
    id: ubuntu
    attributes:
      label: Ubuntu version
      placeholder: Ubuntu 24.04 x64
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - x64 Setup
        - x64 Portable
        - ARM64 Setup
        - ARM64 Portable
        - Source build
    validations:
      required: true
  - type: input
    id: state
    attributes:
      label: Installer state and step
      placeholder: BLOCKED at FEISHU_PAIRING
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use test data and redact every credential.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed all passwords, keys, tokens, private customer data, and server credentials.
          required: true
