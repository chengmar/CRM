name: demo_manufacturer-site

services:
  database:
    image: mariadb:11.4.12
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0.2-php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WP_ENVIRONMENT_TYPE: local
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/demo_manufacturer:/var/www/html/wp-content/themes/demo_manufacturer
      - ./wp-content/plugins/demo_manufacturer-core:/var/www/html/wp-content/plugins/demo_manufacturer-core
      - ./wp-content/uploads:/var/www/html/wp-content/uploads

  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WP_ENVIRONMENT_TYPE: local
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/demo_manufacturer:/var/www/html/wp-content/themes/demo_manufacturer
      - ./wp-content/plugins/demo_manufacturer-core:/var/www/html/wp-content/plugins/demo_manufacturer-core
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./scripts:/opt/demo_manufacturer-tools:ro

volumes:
  database_data:
  wordpress_data:
