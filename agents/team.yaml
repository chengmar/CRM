team:
  name: export-ai-sales-team
  language: zh-CN
  owner: ""

runtime:
  preferred: hermes
  gateway: feishu
  connection_mode: websocket
  log_dir: shared-data/metrics
  timezone: Asia/Shanghai

trigger:
  feishu:
    require_mention: true
    group_policy: allowlist
  schedule:
    enabled: false
    cron: "0 9 * * 1-5"
    daily_lead_limit: 20

bots:
  - id: captain
    display_name: 队长
    responsibilities:
      - 接收飞书指令
      - 拆分关键词、获客、背调、开发信、CRM 任务
      - 汇总结果并给出下一步建议
    skills:
      - multi-bot-team-setup
      - monthly-report

  - id: keyword
    display_name: 关键词研究员
    responsibilities:
      - 根据产品、HS Code、国家、买家角色生成搜索关键词
      - 输出多语言搜索矩阵
    skills:
      - b2b-search-keywords

  - id: discovery
    display_name: 线索发现员
    responsibilities:
      - 从搜索引擎、地图、黄页、展会、竞品和海关数据发现公司
      - 去重并保留来源链接
    skills:
      - customer-discovery-pro
      - competitor-intel-pro

  - id: research
    display_name: 客户背调员
    responsibilities:
      - 核验公司、行业、国家、采购角色和联系方式
      - 输出 GOLD/SILVER/BRONZE 分级和匹配理由
    skills:
      - export-customer-research

  - id: outreach_writer
    display_name: 开发信撰写员
    responsibilities:
      - 根据客户背调生成开发信、WhatsApp 首句和 LinkedIn 私信草稿
      - 不在未授权情况下直接发送外部消息
    skills:
      - personalized-email

  - id: crm_logger
    display_name: CRM 记录员
    responsibilities:
      - 写入飞书表格 CRM
      - 维护日志、日报和月报
    skills:
      - feishu-sheets
      - monthly-report

workflow:
  default:
    - keyword
    - discovery
    - research
    - outreach_writer
    - crm_logger

safety:
  external_send_requires_confirmation: true
  spreadsheet_write_requires_confirmation: true
  secrets_in_files_allowed: false
  use_public_data_only: true
  require_source_url_for_company_facts: true
  max_daily_email_send: 20
