services:
  searxng:
    image: searxng/searxng:2026.7.13-9e25585ae@sha256:11ffedd387dc9cf99e881250c67861470384e55194a86f76df76aa0034a28a1a
    container_name: export-agent-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./runtime/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777

  reacher:
    image: reacherhq/backend:v0.11.7@sha256:cb73c2ee5bd684e014174aba64316d6cd567260f6c6c97fcda47de3fc95f7266
    container_name: export-agent-reacher
    profiles:
      - deep-email-verification
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
